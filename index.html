<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yahoo Finance Markets</title>

    <style>
        html, body {
            background-color: #111827;
            color: #f3f4f6;
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .loading-spinner {
            border: 3px solid rgba(249, 115, 22, 0.2);
            border-top-color: #f97316;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .card-error { border-color: #ef4444 !important; }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { brand: '#f97316' } } }
        };
    </script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-5xl mx-auto">
        <header class="mb-8 border-b-2 border-brand pb-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-3xl font-bold" style="color:#f97316;">Yahoo Finance Markets</h1>
                <p class="text-gray-400 text-sm mt-1">Seguimiento de cotizaciones · actualización cada 60 s</p>
            </div>
            <div class="flex items-center gap-2">
                <span id="last-update" class="text-xs text-gray-500">Esperando actualización...</span>
                <button id="btn-refresh"
                        class="bg-gray-800 hover:bg-gray-700 font-semibold py-2 px-4 rounded-lg transition-colors flex items-center gap-2"
                        style="border:1px solid #f97316;color:#f97316;">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    Actualizar
                </button>
            </div>
        </header>

        <div class="bg-gray-800 rounded-xl p-4 mb-8 shadow-lg" style="border:1px solid #f97316;">
            <label for="symbol-input" class="block text-sm font-medium text-gray-300 mb-2">
                Añadir mercado (Símbolo de Yahoo Finance)
            </label>
            <div class="flex flex-col sm:flex-row gap-2">
                <input type="text" id="symbol-input"
                       placeholder="Ej: AAPL, BTC-USD, ^GSPC, EURUSD=X, SAN.MC"
                       class="flex-1 bg-gray-900 border rounded-lg px-4 py-2 text-white placeholder-gray-500 outline-none"
                       style="border-color:#4b5563;">
                <button id="btn-add"
                        class="font-bold py-2 px-6 rounded-lg shadow-md"
                        style="background-color:#f97316;color:#fff;">
                    Añadir
                </button>
            </div>
            <p id="error-msg" class="text-red-400 text-sm mt-2" style="display:none;"></p>
        </div>

        <div id="markets-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

        <div id="empty-state" class="text-center py-20 border-2 border-dashed border-gray-700 rounded-xl">
            <p class="text-gray-500 text-lg">No hay mercados añadidos.</p>
            <p class="text-gray-600 text-sm mt-2">Añade un símbolo arriba para comenzar.</p>
        </div>

        <div id="global-loader" class="fixed bottom-4 right-4 bg-gray-800 rounded-full p-3 shadow-lg"
             style="display:none;border:1px solid #f97316;">
            <div class="loading-spinner"></div>
        </div>
    </div>

    <script>
        // ============ Configuración ============
        const REFRESH_INTERVAL_MS = 60 * 1000;
        const YAHOO_QUOTE_URL = 'https://query1.finance.yahoo.com/v7/finance/quote?symbols=';

        // Cadena de proxies a probar en orden hasta que uno responda.
        // corsproxy.io suele funcionar bien desde orígenes HTTPS reales (GitHub Pages).
        const PROXIES = [
            (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
            (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
            (url) => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(url)}`
        ];

        // ============ Arranque ============
        document.addEventListener('DOMContentLoaded', () => {
            try { init(); }
            catch (e) {
                console.error(e);
                document.body.innerHTML =
                    '<pre style="color:#f87171;background:#111;padding:1rem;margin:1rem;border:2px solid #ef4444;border-radius:.5rem;white-space:pre-wrap;">Error: '
                    + e.message + '</pre>';
            }
        });

        function init() {
            const $ = (id) => document.getElementById(id);
            const marketsContainer = $('markets-container');
            const emptyState       = $('empty-state');
            const symbolInput      = $('symbol-input');
            const btnAdd           = $('btn-add');
            const btnRefresh       = $('btn-refresh');
            const lastUpdateSpan   = $('last-update');
            const errorMsg         = $('error-msg');
            const globalLoader     = $('global-loader');

            if (!btnAdd || !marketsContainer) {
                throw new Error('Faltan elementos del DOM. El HTML está incompleto.');
            }

            // --- Storage seguro ---
            const storage = (() => {
                try {
                    const k = '__t__';
                    localStorage.setItem(k, '1');
                    localStorage.removeItem(k);
                    return localStorage;
                } catch {
                    const m = {};
                    return {
                        getItem: k => (k in m ? m[k] : null),
                        setItem: (k, v) => { m[k] = String(v); },
                        removeItem: k => { delete m[k]; }
                    };
                }
            })();

            // --- Estado ---
            let markets;
            try { markets = JSON.parse(storage.getItem('yahooMarkets')); } catch { markets = null; }
            if (!Array.isArray(markets) || markets.length === 0) {
                markets = ['AAPL', 'MSFT', 'BTC-USD', '^GSPC', 'SAN.MC'];
            }

            function saveMarkets() {
                try { storage.setItem('yahooMarkets', JSON.stringify(markets)); } catch {}
            }

            function showError(msg) {
                errorMsg.textContent = msg;
                errorMsg.style.display = 'block';
                clearTimeout(showError._t);
                showError._t = setTimeout(() => { errorMsg.style.display = 'none'; }, 6000);
            }

            function formatValue(v, currency = 'USD') {
                if (v == null) return 'N/A';
                if (typeof v === 'number') {
                    try {
                        return new Intl.NumberFormat('es-ES', {
                            style: 'currency', currency: currency || 'USD',
                            minimumFractionDigits: 2, maximumFractionDigits: 2
                        }).format(v);
                    } catch { return v.toFixed(2); }
                }
                return String(v);
            }

            function formatChange(change, pct) {
                if (change == null || pct == null) return { text: '—', color: 'text-gray-400' };
                const sign = change >= 0 ? '+' : '';
                return {
                    text: `${sign}${change.toFixed(2)} (${sign}${pct.toFixed(2)}%)`,
                    color: change >= 0 ? 'text-green-400' : 'text-red-400'
                };
            }

            function createCard(d, isError = false) {
                if (isError) {
                    return `
                        <div class="bg-gray-800 rounded-xl p-4 shadow-lg card-error" data-symbol="${d.symbol}" style="border:1px solid #ef4444;">
                            <div class="flex justify-between items-start mb-2">
                                <h2 class="text-xl font-bold text-white">${d.symbol}</h2>
                                <button class="btn-remove text-gray-500 hover:text-red-500" title="Eliminar">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                    </svg>
                                </button>
                            </div>
                            <p class="text-red-400 text-sm">Símbolo no encontrado en Yahoo Finance.</p>
                        </div>`;
                }

                const { symbol, shortName, regularMarketPrice, regularMarketChange,
                        regularMarketChangePercent, currency, marketState } = d;
                const ch = formatChange(regularMarketChange, regularMarketChangePercent);
                const price = formatValue(regularMarketPrice, currency);
                const state = marketState ? marketState.replace(/_/g, ' ') : '—';
                const borderColor = marketState === 'REGULAR' ? '#f97316' : '#4b5563';

                return `
                    <div class="bg-gray-800 rounded-xl p-4 shadow-lg relative group transition-all"
                         data-symbol="${symbol}"
                         style="border:1px solid ${borderColor};">
                        <button class="btn-remove absolute top-2 right-2 text-gray-500 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"
                                title="Eliminar ${symbol}">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                        <div class="mb-2 pr-6">
                            <h2 class="text-xl font-bold text-white">${symbol}</h2>
                            <p class="text-xs text-gray-400 truncate">${shortName || 'Nombre no disponible'}</p>
                        </div>
                        <div class="flex justify-between items-end mt-4">
                            <div>
                                <p class="text-2xl font-mono font-bold text-white">${price}</p>
                                <p class="${ch.color} text-sm font-semibold">${ch.text}</p>
                            </div>
                            <div class="text-right">
                                <span class="text-xs px-2 py-1 rounded bg-gray-700 text-gray-300 border border-gray-600">${state}</span>
                            </div>
                        </div>
                    </div>
                `;
            }

            function renderCards(cards) {
                if (!cards || cards.length === 0) {
                    marketsContainer.innerHTML = '';
                    emptyState.style.display = '';
                    return;
                }
                emptyState.style.display = 'none';
                marketsContainer.innerHTML = cards.map(c => createCard(c.data, c.isError)).join('');
                document.querySelectorAll('.btn-remove').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const card = e.target.closest('[data-symbol]');
                        if (card) removeMarket(card.getAttribute('data-symbol'));
                    });
                });
            }

            // --- Fetch con cadena de proxies y timeout ---
            async function fetchWithProxy(yahooUrl) {
                for (let i = 0; i < PROXIES.length; i++) {
                    const proxied = PROXIES[i](yahooUrl);
                    try {
                        const controller = new AbortController();
                        const timer = setTimeout(() => controller.abort(), 8000);
                        const res = await fetch(proxied, { signal: controller.signal });
                        clearTimeout(timer);

                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        const json = await res.json();
                        if (json.quoteResponse && Array.isArray(json.quoteResponse.result)) {
                            console.log(`✅ Proxy ${i + 1} OK`);
                            return json.quoteResponse.result;
                        }
                        throw new Error('Respuesta sin quoteResponse');
                    } catch (err) {
                        console.warn(`❌ Proxy ${i + 1} falló:`, err.message);
                    }
                }
                throw new Error('Todos los proxies fallaron');
            }

            async function refreshAll() {
                globalLoader.style.display = 'block';
                lastUpdateSpan.textContent = 'Actualizando...';

                try {
                    const yahooUrl = `${YAHOO_QUOTE_URL}${markets.join(',')}`;
                    const results = await fetchWithProxy(yahooUrl);
                    const map = new Map(results.map(x => [x.symbol, x]));

                    const cards = markets.map(sym => {
                        const d = map.get(sym);
                        return d ? { data: d, isError: false } : { data: { symbol: sym }, isError: true };
                    });

                    renderCards(cards);
                    lastUpdateSpan.textContent = `Última actualización: ${new Date().toLocaleTimeString('es-ES')}`;
                    errorMsg.style.display = 'none';
                } catch (err) {
                    console.error('refreshAll:', err);
                    showError('No se pudo actualizar. Se reintentará en el próximo ciclo.');
                    lastUpdateSpan.textContent = 'Error de actualización';
                } finally {
                    globalLoader.style.display = 'none';
                }
            }

            function addMarket() {
                const symbol = symbolInput.value.trim().toUpperCase();
                if (!symbol) { showError('Introduce un símbolo válido.'); return; }
                if (markets.includes(symbol)) { showError(`${symbol} ya está en la lista.`); return; }
                markets.push(symbol);
                saveMarkets();
                symbolInput.value = '';
                refreshAll();
            }

            function removeMarket(symbol) {
                markets = markets.filter(s => s !== symbol);
                saveMarkets();
                if (markets.length === 0) renderCards([]);
                else refreshAll();
            }

            btnAdd.addEventListener('click', addMarket);
            symbolInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addMarket(); });
            btnRefresh.addEventListener('click', refreshAll);

            refreshAll();
            setInterval(() => {
                if (markets.length > 0 && !document.hidden) refreshAll();
            }, REFRESH_INTERVAL_MS);
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && markets.length > 0) refreshAll();
            });
        }
    </script>
</body>
</html>
